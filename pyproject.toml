[project]
name = "card-battle-rl"
version = "0.1.0"
description = "A minimal, reproducible study of greedy heuristics, hand-written rules and PUCT search on a turn-based card game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["card_battle_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
